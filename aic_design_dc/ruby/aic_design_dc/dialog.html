<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><title>Thông số</title>
<style>
 body{font:12px/1.3 "Segoe UI",sans-serif;margin:0;background:#f4f4f2;color:#222}
 h4{margin:0;padding:6px 10px;background:#dfeadf;font-size:13px}
 .sec{padding:6px 10px}
 label{display:flex;align-items:center;justify-content:space-between;margin:3px 0}
 input[type=number],select{width:90px;padding:2px 4px;box-sizing:border-box}
 table{border-collapse:collapse;width:100%} td,th{padding:1px;font-size:11px;text-align:center}
 td input{width:46px;padding:1px 2px;box-sizing:border-box}
 button{padding:4px 8px;margin:2px 2px 2px 0;cursor:pointer}
 .tip{color:#777;font-size:11px;margin-top:4px}
 #cut td,#cut th{border-bottom:1px solid #ddd;text-align:right;padding:2px 4px} #cut td:first-child,#cut th:first-child{text-align:left}
</style></head><body>
<h4 id="title">Khung tủ</h4>
<div class="sec">
 <label>Rộng <span><input type="number" data-k="width"> mm</span></label>
 <label>Sâu <span><input type="number" data-k="depth"> mm</span></label>
 <label>Cao <span><input type="number" data-k="height"> mm</span></label>
 <label>Dày ván <span><input type="number" step="0.5" data-k="thick"> mm</span></label>
 <label>Dày hậu <span><input type="number" step="0.5" data-k="back_thick"> mm</span></label>
 <label>Len chân <span><input type="number" data-k="plinth"> mm</span></label>
 <label>Có hậu <input type="checkbox" data-k="has_back"></label>
 <label>Kiểu hậu <select data-k="back_style"><option value="overlay">Phủ</option><option value="inset">Âm</option></select></label>
 <label>Cánh <select data-k="door_style"><option value="overlay">Trùm ngoài</option><option value="half">Trùm nửa</option><option value="inset">Lọt lòng</option></select></label>
 <label>Dày cánh <span><input type="number" step="0.5" data-k="door_thick"> mm</span></label>
 <label>Khe hở <span><input type="number" step="0.5" data-k="gap"> mm</span></label>
 <label>Hồi lên trước <span><input type="number" data-k="front_return"> mm</span></label>
 <label>Cao hộc trên <span><input type="number" data-k="loft_height"> mm</span></label>
 <label>Cánh hộc trên <span><input type="number" data-k="loft_doors"></span></label>
</div>
<h4>Khoang</h4>
<div class="sec">
 <table id="cols"><thead><tr><th>#</th><th>Rộng<br>(0=đều)</th><th>Ngăn<br>kéo</th><th>Cao<br>ngăn</th><th>Đợt</th><th>Cánh</th><th></th></tr></thead><tbody></tbody></table>
 <button onclick="addCol()">+ Khoang</button>
 <div class="tip">Kéo giãn: chọn tủ, dùng công cụ Scale (S) của SketchUp, tủ tự tính lại — ván giữ độ dày.</div>
</div>
<div class="sec">
 <button onclick="sketchup.draw()">Vẽ tủ mới</button>
 <button onclick="sketchup.cutlist()">Bảng cắt</button>
 <button onclick="sketchup.dxf()">Xuất DXF</button>
 <table id="cut"></table>
</div>
<script>
 var cur={cols:[]}, timer=null, NUM=['width','depth','height','thick','back_thick','plinth','door_thick','gap','front_return','loft_height','loft_doors'];
 function q(s){return document.querySelectorAll(s)}
 function fill(){
  q('[data-k]').forEach(function(e){var v=cur[e.dataset.k]; if(e.type==='checkbox')e.checked=!!v; else e.value=v;});
  var tb=q('#cols tbody')[0]; tb.innerHTML='';
  cur.cols.forEach(function(c,i){
   var tr=document.createElement('tr'); tr.innerHTML='<td>'+(i+1)+'</td>'+c.map(function(v,j){return '<td><input type="number" data-c="'+i+','+j+'" value="'+v+'"></td>'}).join('')+'<td><button onclick="delCol('+i+')">×</button></td>';
   tb.appendChild(tr);});
  bind();
 }
 function bind(){q('input,select').forEach(function(e){e.onchange=e.oninput=changed;});}
 function changed(){
  q('[data-k]').forEach(function(e){var k=e.dataset.k; cur[k]=e.type==='checkbox'?e.checked:(NUM.indexOf(k)>=0?parseFloat(e.value)||0:e.value);});
  q('[data-c]').forEach(function(e){var p=e.dataset.c.split(','); cur.cols[+p[0]][+p[1]]=parseFloat(e.value)||0;});
  clearTimeout(timer); timer=setTimeout(function(){sketchup.apply(JSON.stringify(cur))},250);
 }
 function addCol(){cur.cols.push([0,0,0,0,1]); fill(); changed();}
 function delCol(i){if(cur.cols.length>1){cur.cols.splice(i,1); fill(); changed();}}
 // Ruby -> JS (không kích hoạt apply)
 function setParams(s,isCab){cur=JSON.parse(s); document.getElementById('title').textContent=isCab?'Khung tủ (đang chọn)':'Khung tủ (mặc định cho tủ mới)'; fill();}
 function showCutlist(s){var r=JSON.parse(s),h='<tr><th>Loại</th><th>Dài</th><th>Rộng</th><th>Dày</th><th>SL</th><th>Dán cạnh</th></tr>';
  r.forEach(function(x){h+='<tr><td>'+x.role+'</td><td>'+x.L+'</td><td>'+x.W+'</td><td>'+x.T+'</td><td>'+x.qty+'</td><td>'+x.banding+'</td></tr>'});
  document.getElementById('cut').innerHTML=h;}
 window.onload=function(){sketchup.ready()};
</script></body></html>
